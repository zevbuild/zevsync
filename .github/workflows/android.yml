name: ZevSync Android CI & Release Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Generate ZevSync APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Ensure Executable Permissions
      run: chmod +x gradlew

    - name: Restore Keystore and Environment Config
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore || true
        fi
        if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        cp debug.keystore app/debug.keystore 2>/dev/null || true
        if [ ! -f ".env" ] && [ -f ".env.example" ]; then
          cp .env.example .env
        elif [ ! -f ".env" ]; then
          touch .env
        fi
        cp .env app/.env 2>/dev/null || true

    - name: Build Android APK
      run: ./gradlew assembleDebug --stacktrace --continue

    - name: Upload Generated APKs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ZevSync-apk
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: warn
        retention-days: 30

