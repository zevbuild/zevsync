name: ZevSync Android CI & Release Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Generate ZevSync APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Ensure Executable Permissions
      run: chmod +x gradlew

    - name: Prepare Configuration
      run: |
        if [ ! -f ".env" ] && [ -f ".env.example" ]; then
          cp .env.example .env
        elif [ ! -f ".env" ]; then
          touch .env
        fi

    - name: Build Android Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Android Release APK
      if: startsWith(github.ref, 'refs/tags/')
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload Generated APKs (Debug)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ZevSync-debug-apk
        path: app/build/outputs/apk/debug/**/*.apk
        if-no-files-found: warn
        retention-days: 30

    - name: Upload Generated APKs (Release)
      uses: actions/upload-artifact@v4
      if: startsWith(github.ref, 'refs/tags/') && always()
      with:
        name: ZevSync-release-apk
        path: app/build/outputs/apk/release/**/*.apk
        if-no-files-found: warn
        retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: ZevSync-release-apk
        path: ./apk-artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./apk-artifacts/**/*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}